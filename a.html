<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Boxes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #111;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 90%;
    }

    .large-box, .small-box {
      background-color: #222;
      color: white;
      padding: 1rem;
      text-align: center;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .large-box {
      height: 200px;
      flex: 1;
    }

    .small-box {
      height: 150px;
      flex: 1;
    }

    .small-boxes-container {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-behavior: smooth;
    }

    .small-box {
      min-width: calc((100% - 1rem) / 2);
    }

    @media (min-width: 600px) {
      .small-boxes-container {
        overflow-x: unset;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="large-box">
      Web Development
    </div>
    <div class="small-boxes-container">
      <div class="small-box">Web Design</div>
      <div class="small-box">SEO</div>
    </div>
  </div>
</body>
</html>
